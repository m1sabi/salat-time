<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>توقيت صلاة الفجر والعشاء في أوروبا</title>

  <!-- Your existing global styles -->
  <link rel="stylesheet" href="styles-big.css">
  <link rel="stylesheet" href="styles-media.css">

  <meta property="og:image" content="images/omawi.png" />
  <meta property="og:title" content="توقيت صلاة الفجر والعشاء في أوروبا" />
  <meta property="og:description" content="To increases our awareness" />

  <link rel="icon" href="images/omawi.png" type="image/x-icon" />
  <link rel="manifest" href="manifest.json" />

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
      appId: "1a773389-de19-4eb3-81fc-0a42855428b9",
      notifyButton: { enable: true },

      /* GITHUB PAGES (project) — worker must live under /salat-time/ */
      serviceWorkerPath: 'm1sabi.github.io/salat-time/OneSignalSDKWorker.js',
      serviceWorkerUpdaterPath: 'm1sabi.github.io/salat-time/OneSignalSDKUpdaterWorker.js',
      serviceWorkerParam: { scope: 'm1sabi.github.io/salat-time/' },

      // allowLocalhostAsSecureOrigin: true // (keep commented in production)
    });
  });
</script>

  <!-- put this before main.js -->
  <script src="https://praytimes.org/code/v2/js/PrayTimes.js"></script>

  <!-- Data sources -->
  <script src="countries.js"></script>
  <script src="data/cities/cities-registry.js"></script>
  <script src="data/cities/cities-de.js"></script>
  <script src="data/cities/cities-sy.js"></script>
  <script src="data/cities/cities-se.js"></script>
  <script src="data/cities/cities-sa.js"></script>
  <script src="data/cities/cities-jo.js"></script>
  <script src="data/cities/cities-sd.js"></script>

  <script src="sounds.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <!-- Single audio element used by the app -->
  <audio id="azanSound" preload="auto"></audio>

  <div class="outer-container">
    <div class="column text-column">
      <div class="centered">

        <div id="countdown"></div>

        <div class="header-container">
          <div class="header-text">
            توقيت الفجر والعشاء حسب فتوى مجلس الإفتاء الأوروبي - 2015
            <br>
            <span>
              حسب قاعدة <span class="green">ساعة و5 دقائق</span> قبل الشروق .. وبعد الغروب
            </span>
          </div>
        </div>

        <div class="centered-container">
          <!-- Country + City -->
          <div class="selectors">
            <select id="countrySelect"></select>
            <select id="citySelect"></select>
          </div>

          <!-- Labels row -->
          <div class="meta-row">
            <div id="calcMethodWrapper" class="labels-row">
              <span>طريقة الحساب</span>
              <span>التاريخ</span>
            </div>
          </div>

          <!-- Method + Day -->
          <div class="selectors">
            <select id="calcMethodSelect">
              <option value="UOIF" data-asr="Standard">اتحاد الجمعيات الإسلامية-فرنسا</option>
              <option value="MWL" data-asr="Standard">رابطة العالم الإسلامي</option>
              <option value="UmmAlQura" data-asr="Standard">أم القرى-مكة المكرمة</option>
            </select>
            <select id="daySelect"></select>
          </div>
          <!-- Centered warning under method/day selectors -->
          <div id="methodWarning" class="warning-text center-note" role="status" aria-live="polite"></div>
          <!-- Navigation Buttons -->
          <div class="nav-buttons">
            <button id="prevDayBtn">← اليوم السابق</button>
            <button id="nextDayBtn">اليوم التالي →</button>
          </div>

          <!-- Latitude + Clock -->
          <div class="latitude-clock">
            <span class="label-strong">خط العرض:</span>
            <span id="latitudeCell" class="label-strong size-095">—</span>
            <span id="digitalClock"></span>
          </div>

          <!-- Prayer Times Table -->
          <div class="div-times">
            <table class="common-table">
              <tr class="tr-times">
                <th>الصلاة</th>
                <td id="selectedDayCell">—</td>
                <th class="small-head">صلاة المغرب والعشاء <br>قياساً لمكة</th>
              </tr>
              <tr class="tr-times">
                <th>الشروق</th>
                <td id="sunriseCell">—</td>
                <td>—</td>
              </tr>
              <tr class="tr-times">
                <th>الفجر</th>
                <td id="fajrCell">—</td>
                <td>—</td>
              </tr>
              <tr class="tr-times">
                <th>الظهر</th>
                <td id="dhuhrCell">—</td>
                <td>—</td>
              </tr>
              <tr class="tr-times">
                <th>العصر</th>
                <td id="asrCell">—</td>
                <td>—</td>
              </tr>
              <tr class="tr-times">
                <th>الغروب</th>
                <td id="sunsetCell">—</td>
                <td id="makkahFotorCell" class="strong">—</td>
              </tr>
              <tr class="tr-times">
                <th>العشاء</th>
                <td id="ishaaCell">—</td>
                <td id="makkahIshaaCell" class="strong blue">—</td>
              </tr>
            </table>
          </div>

          <!-- Audio Controls -->
          <div class="audio-controls">
            <button id="stopAzan">⏹️ إيقاف الأذان</button>
            <label id="soundselect1" for="soundSelect">اختيار مؤذن</label>
            <select id="soundSelect"></select>
            <button id="previewBtn">&#9654;</button>
          </div>

          <div class="top-right">
            <a class="settings-link" href="resources.html">مراجع ومواد</a>
          </div>
          <div class="top-right">
            <a class="settings-link" href="settings.html">إعدادات الصفحة</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>© <span id="y"></span> جميع الحقوق محفوظة</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
