<script>
  // 1) Get a stable external_id for the user (your own or generate once and store)
  async function getOrCreateExternalId() {
    let id = localStorage.getItem('ext_id');
    if (!id) {
      id = 'u_' + Math.random().toString(36).slice(2) + Date.now(); // very simple demo
      localStorage.setItem('ext_id', id);
    }
    // Tell OneSignal to associate the device with your external id
    try { await OneSignal.login(id); } catch (e) {}
    return id;
  }

  // 2) Call your backend to schedule today’s pushes
  async function scheduleTodaysPushes(timesForToday, tz, cityName) {
    const externalId = await getOrCreateExternalId();
    await fetch('https://YOUR_SERVER_HOST/schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        externalId,
        timezone: tz,            // e.g. "Europe/Berlin"
        dateISO: timesForToday.dateISO, // "2025-09-18"
        prayers: [
          // Example payload — fill with your computed times (24h "HH:MM")
          // keys are labels you like; used in notification text
          { key: 'الفجر',    time: timesForToday.fajr },    // "05:56"
          { key: 'الشروق',   time: timesForToday.sunrise }, // "07:01"
          { key: 'الظهر',    time: timesForToday.dhuhr },
          { key: 'العصر',    time: timesForToday.asr },
          { key: 'المغرب',   time: timesForToday.maghrib },
          { key: 'العشاء',   time: timesForToday.ishaa }
        ],
        city: cityName
      })
    });
  }

  // Call scheduleTodaysPushes once you have times (you already compute them in main.js)
  // Example hook right after updateTable() finished computing the day:
  // scheduleTodaysPushes({ dateISO, fajr, sunrise, dhuhr, asr, maghrib: sunset, ishaa }, getCityTimezone(cityKey), selectedCityLabel);
</script>
